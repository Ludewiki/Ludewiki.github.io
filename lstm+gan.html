<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSTM+GAN 技术文档</title>
    <!-- 使用与主页面相同的样式和脚本 -->
    <link type="text/css" href="static/css/styles.css" rel="stylesheet" />
    <link type="text/css" href="static/css/main.css" rel="stylesheet" />
    <script type="text/javascript" src="static/js/marked.min.js"></script>
    <style>
        .container { max-width: 800px; margin: 50px auto; padding: 20px; }
        .markdown-content { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .back-btn { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="javascript:history.back()" class="btn btn-outline-primary back-btn">
            <i class="bi bi-arrow-left"></i> 返回
        </a>
        <div id="content" class="markdown-content"></div>
    </div>

<script>
    // 使用XMLHttpRequest替代fetch，兼容性更好
    function loadMarkdownFile() {
        const mdFile = 'lstm+gan.md';  // 直接指定文件
        
        const xhr = new XMLHttpRequest();
        xhr.open('GET', mdFile, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    document.getElementById('content').innerHTML = marked.parse(xhr.responseText);
                    // 渲染数学公式
                    if (typeof MathJax !== 'undefined') {
                        MathJax.typeset();
                    }
                } else {
                    document.getElementById('content').innerHTML = 
                        `<div class="alert alert-danger">
                            无法加载文档。请确保：
                            <ol>
                                <li>使用本地服务器运行（如：python -m http.server 8000）</li>
                                <li>lstm+gan.md文件与HTML在同一目录</li>
                            </ol>
                            错误代码: ${xhr.status}
                        </div>`;
                }
            }
        };
        
        // 如果是file://协议，设置responseType
        if (window.location.protocol === 'file:') {
            xhr.responseType = 'text';
        }
        
        xhr.send();
    }
    
    // 页面加载完成后执行
    document.addEventListener('DOMContentLoaded', loadMarkdownFile);
</script>
    
    <!-- Bootstrap icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
</body>
</html>
